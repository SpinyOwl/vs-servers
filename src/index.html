<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Pick design (classic|a|b) and theme (classic|dark|light) before first paint: ?design=b&theme=classic, else saved choice.
    (function () {
      var d = document.documentElement, q = new URLSearchParams(location.search);
      function pick(key, allowed, fallback) {
        var v = q.get(key);
        try { if (allowed.indexOf(v) < 0) v = localStorage.getItem('vs-' + key); } catch (e) {}
        return allowed.indexOf(v) < 0 ? fallback : v;
      }
      var design = pick('design', ['classic', 'a', 'b'], 'a');
      var theme = pick('theme', ['classic', 'dark', 'light'], 'classic');
      d.setAttribute('data-design', design);
      d.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Vintage Story — Public Servers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

</body>
</html>
