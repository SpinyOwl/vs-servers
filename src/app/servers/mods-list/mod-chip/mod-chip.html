<button
  type="button"
  class="mod-chip"
  (click)="onClick()"
  (mouseenter)="onPointerEnter()"
  (mouseleave)="onPointerLeave()"
  (focus)="onFocus()"
  (blur)="onPointerLeave()"
  #chipButton
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="tooltipVisible() ? tooltipId : null"
>
  <span class="mod-chip-name">{{ mod().id }}</span>
  <span class="mod-chip-version">{{ mod().version }}</span>
</button>

@if (tooltipVisible()) {
  @let tip = tooltip();
  <div
    #tooltipElement
    class="mod-chip-tooltip"
    [class.mod-chip-tooltip--positioned]="tooltipPosition()"
    [style.top.px]="tooltipPosition()?.top"
    [style.left.px]="tooltipPosition()?.left"
    role="tooltip"
    [attr.id]="tooltipId"
    aria-live="polite"
  >
    @if (tip.logoUrl; as logo) {
      <img class="mod-chip-tooltip-logo" [src]="logo" alt="" decoding="async" crossorigin="anonymous" />
    }
    <div class="mod-chip-tooltip-content">
      <div class="mod-chip-tooltip-title">{{ tip.title }}</div>
      @if (tip.meta) {
        <div class="mod-chip-tooltip-meta">{{ tip.meta }}</div>
      }
      @if (tip.summary) {
        <div class="mod-chip-tooltip-summary">{{ tip.summary }}</div>
      }
      @if (tip.stats.length) {
        <ul class="mod-chip-tooltip-stats">
          @for (stat of tip.stats; track stat) {
            <li>{{ stat }}</li>
          }
        </ul>
      }
    </div>
  </div>
}
