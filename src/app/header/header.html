<header class="header">
  <h1 class="title"><a href="/">Vintage Story — Public Servers</a></h1>
  <nav class="top-right" aria-label="Site">
    <div class="design-switch" role="group" aria-label="Design variant">
      @for (d of designs; track d.id) {
        <button
          type="button"
          class="seg"
          [class.active]="design() === d.id"
          [attr.aria-pressed]="design() === d.id"
          [title]="d.title"
          (click)="setDesign(d.id)"
        >{{ d.label }}</button>
      }
    </div>
    <button
      type="button"
      class="btn theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{
        theme() === 'dark' ? 'light_mode' : 'dark_mode'
      }}</span>
    </button>
    <a href="mailto:contact@spinyowl.com" class="btn">Contact</a>
    <a routerLink="/feedback" class="btn">Feedback</a>
  </nav>
</header>
